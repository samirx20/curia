[package]
name = "curia-host"
description = "Curia's host service: drives the agent CLIs and owns all state."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
curia-core.workspace = true
futures-util = "0.3.34"
getrandom = "0.4"
hkdf = "0.13"
p256 = { version = "0.14.0", features = ["ecdsa", "ecdh"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "net", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
uuid = { version = "1.29.0", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
curia-client = { path = "../core/client" }
