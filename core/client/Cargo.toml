[package]
name = "curia-client"
description = "Curia's client: connects to a host over the link. Also the `curia` command-line client."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "curia"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
curia-core.workspace = true
futures-util = "0.3.34"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tokio-tungstenite = "0.29"
