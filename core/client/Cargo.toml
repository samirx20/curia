[package]
name = "curia-client"
description = "Curia's client: connects to a host over the link. Also the `curia` command-line client."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "curia"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
curia-core.workspace = true
futures-util = "0.3.34"
getrandom = "0.4"
p256 = { version = "0.14.0", features = ["ecdsa"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
