[package]
name = "curia-desktop"
description = "Curia's desktop app: Qt 6 / QML on a Rust bridge (CXX-Qt), talking to a host over the link."
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "curia-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
curia-client = { path = "../core/client" }
curia-core = { path = "../core" }
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }

# Its own workspace: it needs the Qt C++ SDK to build, which the main workspace's CI doesn't have.
[workspace]

[profile.dev]
debug = 0
